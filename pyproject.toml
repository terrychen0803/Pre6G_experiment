[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pre6g-experiment"
version = "0.1.0"
description = "k3s profiling and energy-aware placement experiment prototype"
requires-python = ">=3.10"
dependencies = ["PyYAML==6.0.2"]

[project.scripts]
pre6g-experiment = "pre6g_experiment.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

