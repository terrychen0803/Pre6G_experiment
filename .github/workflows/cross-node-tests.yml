name: Cross-node workflow tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cross-node-tests.yml'
      - 'scripts/run_cross_node_dryrun.py'
      - 'scripts/run_experiment_pipeline.py'
      - 'tests/test_cross_node_dryrun.py'
      - 'tests/test_experiment_pipeline.py'
      - 'tests/test_validation_runs.py'
      - 'scripts/plan_validation_runs.py'
      - 'examples/yolo26/**'
      - 'k8s/formal/**'
      - 'models/**'
      - 'src/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-power-model.txt
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_cross_node_dryrun.py' -v
      - run: python -m unittest discover -s tests -p 'test_experiment_pipeline.py' -v
      - run: python -m unittest discover -s tests -p 'test_validation_runs.py' -v
